# Reference template for Shogun-CD configuration.
# The setup script (curl ... | sh) mirrors every key below — replace placeholders with your values.

debug: true

data_dir: "/var/lib/shogun/" # Use absolute path or could provide the current root dir of the project

git:
    create_deploy_key: true
    repo: "git@github.com:<github_username>/shogun-manifest-demo.git"
    branch: "main"
    polling_interval: 5

api:
    admin:
        email: "captainav0608@gmail.com"
        password: "password"
    port: 7007
    jwt:
        secret: "jwt-secret"
        expiration_hours: 1
    enable_api_spec: true

# Database configuration (Configured to use with "make start")
database:
    host: "127.0.0.1"
    port: 5432
    user: "shogun"
    password: "pwd"
    dbname: "shogun_db"
    ssl_mode: "disable"
    master_key: "qwertyuiop"
    encryption_salt: "salty-salt"
    