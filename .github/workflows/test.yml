name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

  frontend:
    name: Frontend (UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The UI lives under ui/ and isn't present on every branch yet, so skip
      # cleanly instead of failing when there's nothing to test. hashFiles()
      # can't be used in a job-level `if:` (no checkout has happened yet at
      # that point), so gate each later step on this step's output instead.
      - id: ui
        run: echo "present=$([ -f ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm ci

      - name: Lint
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm run typecheck --if-present

      - name: Test
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm run test --if-present
