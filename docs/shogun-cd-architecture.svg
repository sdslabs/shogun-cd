<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F7FC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1F3A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5B73"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0086FF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00A86B"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E88A00"/>
    </marker>
  </defs>

  <rect width="900" height="710" fill="url(#bg)"/>

  <!-- Edges (all 2.5px) -->
  <g fill="none" stroke-width="2.5">
    <path d="M260,120 C260,170 380,150 400,200" stroke="#4A5B73" marker-end="url(#arrow)"/>
    <path d="M640,120 C640,170 520,150 500,200" stroke="#4A5B73" marker-end="url(#arrow)"/>
    <path d="M450,290 L450,380" stroke="#0086FF" marker-end="url(#arrowBlue)"/>
    <path d="M670,425 L600,425" stroke="#E88A00" marker-end="url(#arrowOrange)"/>
    <path d="M450,470 L450,580" stroke="#00A86B" marker-end="url(#arrowGreen)"/>
    <path d="M300,425 L100,425 Q60,425 60,385 L60,120 Q60,80 100,80 L120,80" stroke="#00A86B" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Edge labels (all 13px, 1.5px pill border) -->
  <g font-size="13" font-weight="500" text-anchor="middle" fill="#2B3A52">
    <g><rect x="124" y="152" width="150" height="26" rx="13" fill="#fff" stroke="#C9D3E0" stroke-width="1.5"/><text x="199" y="170">clone, poll &amp; index</text></g>
    <g><rect x="624" y="152" width="170" height="26" rx="13" fill="#fff" stroke="#C9D3E0" stroke-width="1.5"/><text x="709" y="170">webhook + build values</text></g>
    <g><rect x="465" y="322" width="130" height="26" rx="13" fill="#fff" stroke="#C9D3E0" stroke-width="1.5"/><text x="530" y="340">match a pipeline</text></g>
    <g><rect x="465" y="513" width="90" height="26" rx="13" fill="#fff" stroke="#C9D3E0" stroke-width="1.5"/><text x="510" y="531">sync / exec</text></g>
    <g><rect x="5" y="234" width="110" height="46" rx="14" fill="#fff" stroke="#C9D3E0" stroke-width="1.5"/>
       <text x="60" y="253">mutate</text>
       <text x="60" y="271">commit &amp; push</text></g>
  </g>

  <!-- Nodes: all 2px border, 12px radius -->
  <g filter="url(#shadow)" stroke-width="2">
    <rect x="120" y="40" width="280" height="80" rx="12" fill="#fff" stroke="#4A5B73"/>
    <rect x="500" y="40" width="280" height="80" rx="12" fill="#fff" stroke="#4A5B73"/>
    <rect x="300" y="200" width="300" height="90" rx="12" fill="#E3F0FF" stroke="#0086FF"/>
    <rect x="300" y="380" width="300" height="90" rx="12" fill="#E3F0FF" stroke="#0086FF"/>
    <rect x="310" y="580" width="280" height="80" rx="12" fill="#E8F7F0" stroke="#00A86B"/>
    <path d="M670,392 L670,458 A80,14 0 0 0 830,458 L830,392 Z" fill="#FFF4E0" stroke="#E88A00"/>
    <ellipse cx="750" cy="392" rx="80" ry="14" fill="#FFE2B0" stroke="#E88A00"/>
  </g>

  <!-- Node text: titles 16px bold, subtitles 13px medium -->
  <g text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">
    <text x="260" y="76">Manifest Git repository</text>
    <text x="640" y="86">CI system</text>
    <text x="450" y="250">Shogun-CD</text>
    <text x="450" y="418">run steps in order</text>
    <text x="750" y="426">encrypted secrets</text>
    <text x="450" y="616">Your servers</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500">
    <text x="260" y="98" fill="#5B6B82">Pipelines / Targets / files</text>
    <text x="450" y="444" fill="#0066CC">sync / exec / mutate</text>
    <text x="750" y="446" fill="#8A6A2F">(PostgreSQL)</text>
    <text x="450" y="638" fill="#3F6B58">(SSH / SFTP)</text>
  </g>
</svg>
