x-logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
services:
  db:
    image: postgres:18.3-alpine3.23
    environment:
      - POSTGRES_USER=${DB_POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_POSTGRES_USER}", "-d", "${DB_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  ui:
    image: devyarustagi/shogun-ui:latest
    ports:
      - "7006:7006"
    environment:
      - SHOGUN_HOST=host.docker.internal
      - SHOGUN_PORT=${SHOGUN_PORT}
    extra_hosts:
     - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *default-logging

volumes:
  db-data:




